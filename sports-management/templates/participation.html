{% extends "base.html" %}{% block content %}<h1>Student Participation</h1><div class="card"><form method="post"><input type="hidden" name="_csrf" value="{{session._csrf}}"><div class="formgrid"><label>Event<select name="event_id">{% for e in events %}<option value="{{e.id}}">{{e.name}} — {{e.game}}</option>{% endfor %}</select></label><label>Student<select name="student_id">{% for s in students %}<option value="{{s.id}}">{{s.name}} — {{s.house}}</option>{% endfor %}</select></label><label>Performance<input name="performance"></label><label>Position<input name="position"></label><label>Remarks<input name="remarks"></label></div><button>Save</button></form></div><table><tr><th>Event</th><th>Game</th><th>Student</th><th>Performance</th><th>Position</th><th>Remarks</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.game}}</td><td>{{r.student_name}}</td><td>{{r.performance}}</td><td>{{r.position}}</td><td>{{r.remarks}}</td></tr>{% endfor %}</table>{% endblock %}
