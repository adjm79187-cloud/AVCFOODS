{% extends "base.html" %}{% block content %}<h1>Events</h1><div class="card"><form method="post"><input type="hidden" name="_csrf" value="{{session._csrf}}"><div class="formgrid"><label>Event Name<input name="name" required></label><label>Category<select name="category">{% for x in CATS %}<option>{{x}}</option>{% endfor %}</select></label><label>Game/Sports<select name="game">{% for x in GAMES %}<option>{{x}}</option>{% endfor %}</select></label><label>Date<input type="date" name="event_date" required></label><label>House 1<select name="house1">{% for h in HOUSES %}<option>{{h}}</option>{% endfor %}</select></label><label>VS House 2<select name="house2">{% for h in HOUSES %}<option>{{h}}</option>{% endfor %}</select></label><label>Venue<input name="venue"></label><label>Description<input name="description"></label></div><button>Create Event</button></form></div><table><tr><th>Date</th><th>Event</th><th>Category</th><th>Game</th><th>Match</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r.event_date}}</td><td>{{r.name}}</td><td>{{r.category}}</td><td>{{r.game}}</td><td>{{r.house1}} VS {{r.house2}}</td><td><form method="post" action="{{url_for('event_delete',eid=r.id)}}"><input type="hidden" name="_csrf" value="{{session._csrf}}"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
