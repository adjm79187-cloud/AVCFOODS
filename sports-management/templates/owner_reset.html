{% extends "base.html" %}{% block content %}<div class="card"><h2>Owner Password Reset</h2><form method="post"><input type="hidden" name="_csrf" value="{{session._csrf}}"><label>User<select name="user_id">{% for u in users %}<option>{{u.user_id}}</option>{% endfor %}</select></label><label>New Password<input name="password" minlength="8" required></label><button>Reset</button></form></div><h2>Recent Reset Requests</h2><table><tr><th>User ID</th><th>Time</th><th>Status</th></tr>{% for r in requests %}<tr><td>{{r.user_id}}</td><td>{{r.requested_at}}</td><td>{{r.status}}</td></tr>{% endfor %}</table>{% endblock %}
