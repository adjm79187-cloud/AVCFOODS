{% extends "base.html" %}{% block content %}<h1>Certificates</h1><div class="card"><form method="post"><input type="hidden" name="_csrf" value="{{session._csrf}}"><div class="formgrid"><label>Student<select name="student_id">{% for s in students %}<option value="{{s.id}}">{{s.name}} — {{s.house}}</option>{% endfor %}</select></label><label>Event Name<input name="event_name" required></label><label>Game<input name="game"></label><label>Position/Award<input name="position"></label><label>Date<input name="certificate_date" type="date" required></label><label>Remarks<input name="remarks"></label></div><button>Create Record</button></form></div><table><tr><th>Student</th><th>Event</th><th>Game</th><th>Award</th><th>Date</th><th>View</th></tr>{% for r in rows %}<tr><td>{{r.student_name}}</td><td>{{r.event_name}}</td><td>{{r.game}}</td><td>{{r.position}}</td><td>{{r.certificate_date}}</td><td><a href="{{url_for('certificate',cid=r.id)}}">Certificate</a></td></tr>{% endfor %}</table>{% endblock %}
