{% extends "base.html" %}{% block content %}<h1>House Results</h1><div class="card"><form method="post"><input type="hidden" name="_csrf" value="{{session._csrf}}"><div class="formgrid"><label>Event<select name="event_id">{% for e in events %}<option value="{{e.id}}">{{e.name}} — {{e.game}} — {{e.event_date}}</option>{% endfor %}</select></label><label>House<select name="house">{% for h in HOUSES %}<option>{{h}}</option>{% endfor %}</select></label><label>Position<input name="position" required></label><label>Points<input type="number" step=".1" name="points" required></label><label>Remarks<input name="remarks"></label></div><button>Save</button></form></div><table><tr><th>Event</th><th>Game</th><th>House</th><th>Position</th><th>Points</th><th>Remarks</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.game}}</td><td>{{r.house}}</td><td>{{r.position}}</td><td>{{r.points}}</td><td>{{r.remarks}}</td></tr>{% endfor %}</table>{% endblock %}
