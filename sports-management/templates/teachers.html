{% extends "base.html" %}{% block content %}<h1>Teachers / Users</h1><div class="card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{session._csrf}}"><div class="formgrid"><label>User ID<input name="user_id" required></label><label>Initial Password<input name="password" minlength="8" required></label><label>Name<input name="name" required></label><label>Designation<input name="designation"></label><label>Role<select name="role"><option value="sports_teacher">Sports Teacher</option><option value="house_teacher">House Teacher</option></select></label><label>House<select name="house">{% for h in HOUSES %}<option>{{h}}</option>{% endfor %}</select></label><label>Photo<input type="file" name="photo"></label></div><button>Create</button></form></div><table><tr><th>Name</th><th>User ID</th><th>Role</th><th>House</th><th>Status</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.user_id}}</td><td>{{r.role}}</td><td>{{r.house}}</td><td>{{'Active' if r.active else 'Disabled'}}</td><td><form method="post" action="{{url_for('teacher_disable',tid=r.id)}}"><input type="hidden" name="_csrf" value="{{session._csrf}}"><button class="danger">Disable</button></form></td></tr>{% endfor %}</table>{% endblock %}
