{% extends "base.html" %}{% block content %}<h1>Final Settings — Owner Only</h1><div class="card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{session._csrf}}"><div class="formgrid"><label>School Name<input name="school_name" value="{{s.school_name}}"></label><label>School Address<input name="school_address" value="{{s.school_address}}"></label><label>Principal Name<input name="principal_name" value="{{s.principal_name}}"></label><label>Sports Teacher Name<input name="sports_teacher_name" value="{{s.sports_teacher_name}}"></label>{% for i in range(1,5) %}<label>House {{i}} Name<input name="house_{{i}}" value="{{s['house_'+i|string]}}"></label>{% endfor %}<label>School Logo<input type="file" name="school_logo"></label>{% for i in range(1,5) %}<label>House {{i}} Logo<input type="file" name="house_logo_{{i}}"></label>{% endfor %}</div><button>Save All Settings</button></form></div>{% endblock %}
