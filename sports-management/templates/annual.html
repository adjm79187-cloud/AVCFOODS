{% extends "base.html" %}{% block content %}<h1>Annual Function / Sports Records</h1><div class="card"><form method="post"><input type="hidden" name="_csrf" value="{{session._csrf}}"><div class="formgrid"><label>Event Name<input name="name" required></label><label>Category<select name="category">{% for x in CATS %}<option>{{x}}</option>{% endfor %}</select></label><label>Date<input type="date" name="event_date" required></label><label>House<select name="house">{% for h in HOUSES %}<option>{{h}}</option>{% endfor %}</select></label><label>Position<input name="position"></label><label>Points<input name="points" type="number" step=".1" value="0"></label><label>Remarks<input name="remarks"></label></div><button>Save</button></form></div><table><tr><th>Date</th><th>Event</th><th>Category</th><th>House</th><th>Position</th><th>Points</th></tr>{% for r in rows %}<tr><td>{{r.event_date}}</td><td>{{r.name}}</td><td>{{r.category}}</td><td>{{r.house}}</td><td>{{r.position}}</td><td>{{r.points}}</td></tr>{% endfor %}</table>{% endblock %}
